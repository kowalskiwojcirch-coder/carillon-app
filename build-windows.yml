name: Build Carillon for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'package.json'
      - 'index.html'
      - 'vite.config.js'
      - 'src/**'
      - 'src-tauri/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Skonfiguruj Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Zainstaluj zależności frontendu
        run: npm install
      - name: Zbuduj aplikację Windows
        run: npm run tauri:build
      - name: Zbierz instalatory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $paths = @(
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/msi/*.msi"
          )
          foreach ($pattern in $paths) {
            Get-ChildItem $pattern -ErrorAction SilentlyContinue | Copy-Item -Destination output
          }
          if (-not (Get-ChildItem output -File)) {
            Write-Error "Nie znaleziono instalatora. Sprawdź logi kroku budowania."
          }
      - name: Udostępnij instalator
        uses: actions/upload-artifact@v4
        with:
          name: Carillon-Windows-Installer
          path: output/*
          if-no-files-found: error
